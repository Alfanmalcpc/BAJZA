<style>
/* Animasi Tulisan (Typing Effect) */
.typewriter {
  display: inline-block;
  overflow: hidden; 
  white-space: nowrap; 
  border-right: .15em solid var(--text-1);
  animation: typing 2s steps(30, end), blink-caret .75s step-end infinite;
}
@keyframes typing {
  from { width: 0 }
  to { width: 100% }
}
@keyframes blink-caret {
  from, to { border-color: transparent }
  50% { border-color: var(--text-1); }
}

/* Card Auth bergaya Neo-brutalism */
.auth-wrapper {
  min-height: calc(100vh - var(--nav-h) - var(--bottom-h));
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.auth-box {
  width: 100%;
  max-width: 440px;
  background: var(--bg-card);
  border: 4px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  padding: 32px;
  position: relative;
  z-index: 1;
}

/* Tabs */
.auth-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}
.auth-tab {
  flex: 1;
  padding: 12px;
  border: 3px solid var(--border);
  border-radius: var(--r-md);
  background: #fff;
  font-weight: 800;
  font-size: 16px;
  box-shadow: var(--shadow-sm);
  transition: all var(--tr);
  color: var(--text-1);
}
.auth-tab.active {
  background: var(--bg-base);
  transform: translate(3px, 3px);
  box-shadow: 0px 0px 0px #000;
}

/* Input Forms */
.auth-form { display: flex; flex-direction: column; gap: 16px; }
.auth-form.hidden { display: none; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 14px; font-weight: 800; color: var(--text-2); }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-icon { position: absolute; left: 12px; font-size: 16px; pointer-events: none; }
.form-input {
  width: 100%;
  padding: 12px 12px 12px 40px;
  border: 3px solid var(--border);
  border-radius: var(--r-md);
  background: #fff;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 500;
  color: var(--text-1);
  box-shadow: var(--shadow-sm);
  transition: all var(--tr);
}
.form-input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 3px 3px 0px var(--blue);
}

/* Buttons */
.btn-auth {
  width: 100%; padding: 14px;
  border: 3px solid var(--border);
  border-radius: var(--r-md);
  background: var(--blue);
  color: #fff;
  font-size: 16px; font-weight: 800;
  box-shadow: var(--shadow-sm);
  transition: all var(--tr);
  margin-top: 8px;
}
.btn-auth:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-md); }
.btn-auth:active { transform: translate(2px, 2px); box-shadow: var(--shadow-hover); }

.divider {
  text-align: center; font-weight: 800; font-size: 14px; color: var(--text-3);
  margin: 12px 0; position: relative;
}

.btn-google {
  width: 100%; padding: 12px;
  border: 3px solid var(--border);
  border-radius: var(--r-md);
  background: #fff;
  color: var(--text-1);
  font-size: 16px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: var(--shadow-sm);
  transition: all var(--tr);
}
.btn-google:hover { background: #f3f4f6; transform: translate(-2px, -2px); box-shadow: var(--shadow-md); }
.btn-google:active { transform: translate(2px, 2px); box-shadow: var(--shadow-hover); }

/* Messages */
.auth-msg {
  padding: 12px; border: 3px solid var(--border); border-radius: var(--r-md);
  font-weight: 700; font-size: 14px;
  display: none; margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.auth-msg.error { display: block; background: #ff7675; }
.auth-msg.success { display: block; background: #55efc4; }

.auth-footer { text-align: center; margin-top: 24px; font-weight: 700; font-size: 14px; }
.auth-footer a { color: var(--blue); text-decoration: underline; }

/* Loading Spinner */
.spinner {
  width: 16px; height: 16px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top-color: #fff; border-radius: 50%;
  animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<section class="section" style="background-color: var(--bg-base); min-height: 100vh;">
  <div class="container auth-wrapper">
    <div class="auth-box">

      <!-- Brand & Typing Animation -->
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="logo-badge" style="margin: 0 auto 12px; width: 64px; height: 64px; border-radius: 16px; background: #fff; padding: 4px; box-shadow: var(--shadow-sm); border: 3px solid var(--border);">
          <img src="/src/assets/img/Logo.svg" alt="BAJA" style="width:100%;height:100%;object-fit:contain;">
        </div>
        <h1 style="font-family: var(--font-heading); font-size: 36px; letter-spacing: 2px; color: var(--text-1);">BAJA WEB</h1>
        <div style="height: 24px; margin-top: 4px;">
          <span class="typewriter" id="authTagline" style="font-weight: 700; color: var(--text-2);">Selamat datang kembali!</span>
        </div>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Masuk</button>
        <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Daftar</button>
      </div>

      <!-- Messages -->
      <div class="auth-msg" id="authMsg"></div>

      <!-- ── Login Form ── -->
      <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrap">
            <span class="input-icon">✉️</span>
            <input type="email" id="loginEmail" class="form-input" placeholder="nama@email.com" required autocomplete="email"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Kata Sandi</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password"/>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="loginBtn">Masuk ke Akun</button>
        <div class="divider">atau lanjutkan dengan</div>
        <button type="button" class="btn-google" onclick="handleGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </button>
      </form>

      <!-- ── Register Form ── -->
      <form class="auth-form hidden" id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Nama Tampilan</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="regName" class="form-input" placeholder="Nama Anda" required autocomplete="name" maxlength="40"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrap">
            <span class="input-icon">✉️</span>
            <input type="email" id="regEmail" class="form-input" placeholder="nama@email.com" required autocomplete="email"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Kata Sandi</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword" class="form-input" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Konfirmasi Kata Sandi</label>
          <div class="input-wrap">
            <span class="input-icon">✅</span>
            <input type="password" id="regConfirm" class="form-input" placeholder="Ulangi kata sandi" required autocomplete="new-password"/>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="registerBtn">Buat Akun Baru</button>
        <div class="divider">atau lanjutkan dengan</div>
        <button type="button" class="btn-google" onclick="handleGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </button>
      </form>

      <div class="auth-footer">
        <a href="/public/index.html">← Kembali ke Beranda tanpa login</a>
      </div>
    </div>
  </div>

<script>
// Redirect if already logged in
auth.onAuthStateChanged(user => {
  if (user) window.location.href = 'index.html';
});

function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
  document.getElementById('registerForm').classList.toggle('hidden', isLogin);
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);
  const tagline = document.getElementById('authTagline');
  tagline.textContent = isLogin ? 'Selamat datang kembali!' : 'Buat akun gratis Anda';
  
  // Restart typing animation
  tagline.style.animation = 'none';
  tagline.offsetHeight; // trigger reflow
  tagline.style.animation = null;

  clearMsg();
}

function showMsg(text, type) {
  const el = document.getElementById('authMsg');
  el.textContent = text;
  el.className = 'auth-msg ' + type;
}
function clearMsg() {
  const el = document.getElementById('authMsg');
  el.className = 'auth-msg';
}

function friendlyError(code) {
  const map = {
    'auth/user-not-found':        'Email tidak terdaftar.',
    'auth/wrong-password':        'Kata sandi salah.',
    'auth/invalid-email':         'Format email tidak valid.',
    'auth/email-already-in-use':  'Email sudah digunakan akun lain.',
    'auth/weak-password':         'Kata sandi terlalu lemah (min. 6 karakter).',
    'auth/popup-closed-by-user':  'Popup ditutup sebelum selesai. Coba lagi.',
    'auth/network-request-failed':'Koneksi internet bermasalah. Periksa jaringan Anda.',
    'auth/invalid-credential':    'Email atau kata sandi salah. Periksa kembali.',
    'auth/too-many-requests':     'Terlalu banyak percobaan. Coba lagi beberapa saat.',
  };
  return map[code] || 'Terjadi kesalahan. Silakan coba lagi.';
}

function setLoading(btnId, loading, label) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading
    ? `<span class="spinner"></span> Memproses...`
    : label;
}

async function handleLogin(e) {
  e.preventDefault();
  clearMsg();
  setLoading('loginBtn', true, 'Masuk ke Akun');
  try {
    await bajaSignIn(
      document.getElementById('loginEmail').value.trim(),
      document.getElementById('loginPassword').value
    );
    showMsg('✅ Berhasil masuk! Mengalihkan...', 'success');
    setTimeout(() => window.location.href = 'index.html', 900);
  } catch(err) {
    showMsg('❌ ' + friendlyError(err.code), 'error');
    setLoading('loginBtn', false, 'Masuk ke Akun');
  }
}

async function handleRegister(e) {
  e.preventDefault();
  clearMsg();
  const pass = document.getElementById('regPassword').value;
  const conf = document.getElementById('regConfirm').value;
  if (pass !== conf) { showMsg('❌ Kata sandi tidak cocok.', 'error'); return; }
  setLoading('registerBtn', true, 'Buat Akun Baru');
  try {
    await bajaSignUp(
      document.getElementById('regEmail').value.trim(),
      pass,
      document.getElementById('regName').value.trim()
    );
    showMsg('✅ Akun berhasil dibuat! Mengalihkan...', 'success');
    setTimeout(() => window.location.href = 'index.html', 900);
  } catch(err) {
    showMsg('❌ ' + friendlyError(err.code), 'error');
    setLoading('registerBtn', false, 'Buat Akun Baru');
  }
}

async function handleGoogle() {
  clearMsg();
  try {
    await bajaSignInGoogle();
    showMsg('✅ Berhasil! Mengalihkan...', 'success');
    setTimeout(() => window.location.href = 'index.html', 900);
  } catch(err) {
    showMsg('❌ ' + friendlyError(err.code), 'error');
  }
}
</script>
