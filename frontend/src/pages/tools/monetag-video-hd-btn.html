<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buka Kualitas HD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    button {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      height: 100%;
      font-size: 15px;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
  <script>
    // Script Monetag untuk memicu iklan popunder saat tombol diklik
    (function(s){
      s.dataset.zone='11493758';
      s.src='https://al5sm.com/tag.min.js';
    })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
    function handleClick() {
      // Kirim pesan ke parent window bahwa iklan telah ditonton/diklik untuk membuka unduhan HD
      window.parent.postMessage('unlock_hd_download', '*');
      document.querySelector('button').textContent = 'Sponsor Terverifikasi — Memproses Unduhan...';
      document.querySelector('button').style.background = '#10b981';
    }
  </script>
  <script src="https://5gvci.com/act/files/tag.min.js?z=11493748" data-cfasync="false" async data-sw="/tools/sw.js"></script>
</head>
<body>
  <button onclick="handleClick()">Lihat Iklan Sponsor &amp; Buka Kualitas HD</button>
</body>
</html>
