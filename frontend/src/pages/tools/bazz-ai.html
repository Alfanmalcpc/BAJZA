<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Bazz AI — Asisten Cerdas BAJA</title>
  <link rel="icon" href="/src/assets/img/bazz-mascot.svg"/>
  <link rel="stylesheet" href="/src/assets/css/style.css"/>
  <link rel="stylesheet" href="/src/assets/css/responsive.css"/>
  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #032030 0%, #020b14 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-container {
      max-width: 850px;
      margin: 80px auto 20px;
      width: 95%;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.15);
      overflow: hidden;
    }
    .chat-header {
      padding: 16px 24px;
      background: rgba(2, 132, 199, 0.12);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .mascot-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      padding: 2px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }
    .mascot-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .mascot-info h2 {
      margin: 0;
      font-size: 20px;
      color: #38bdf8;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .mascot-info p {
      margin: 2px 0 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      margin-right: 6px;
    }
    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 380px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 18px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }
    .msg-bot {
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: #f1f5f9;
      border-bottom-left-radius: 4px;
    }
    .msg-user {
      align-self: flex-end;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
    }
    .chat-input-area {
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      background: rgba(30, 41, 59, 0.7);
      border: 1.5px solid rgba(56, 189, 248, 0.3);
      padding: 12px 16px;
      border-radius: 12px;
      color: #f8fafc;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    .chat-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }
    .send-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/public/index.html" class="nav-logo" style="text-decoration:none">
        <div class="logo-badge"><img src="/src/assets/img/Logo.svg" alt="BAJA"></div>
        <div class="logo-text">BAJA</div>
      </a>
      <div class="nav-actions">
        <!-- navClock and navAuthSlot -->
      </div>
    </div>
  </nav>

  <!-- Chat Box Container -->
  <div class="chat-container">
    <div class="chat-header">
      <div class="mascot-avatar">
        <img src="/src/assets/img/bazz-mascot.svg" alt="Bazz Mascot">
      </div>
      <div class="mascot-info">
        <h2>Bazz AI</h2>
        <p><span class="status-badge"></span>Siap membantu seputar tools, coding, dan fitur BAJA</p>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="msg msg-bot">
        Halo Alfan! Aku <strong>Bazz</strong>, badak cyber sekaligus asisten AI resmi BAJA. Ada yang bisa kubantu hari ini?
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="userInput" class="chat-input" placeholder="Tanyakan apa saja pada Bazz..." autocomplete="off"/>
      <button class="send-btn" id="sendBtn">Kirim</button>
    </div>
  </div>

  <script src="/src/App.js"></script>
  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(sender, text) {
      const msg = document.createElement('div');
      msg.className = 'msg ' + (sender === 'user' ? 'msg-user' : 'msg-bot');
      msg.textContent = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';

      // Tampilkan typing bubble
      const typing = document.createElement('div');
      typing.className = 'msg msg-bot';
      typing.id = 'typingBubble';
      typing.textContent = 'Bazz sedang berpikir...';
      chatMessages.appendChild(typing);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // Hubungkan ke endpoint backend jika aktif, atau fallback pintar
      try {
        const res = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        typing.remove();
        if (data && data.reply) {
          appendMessage('bot', data.reply);
        } else {
          appendMessage('bot', 'Halo Alfan! Jawaban ini siap dihubungkan langsung ke Gemini API di backend BAJA!');
        }
      } catch (err) {
        typing.remove();
        appendMessage('bot', 'Halo Alfan! Aku Bazz siap membantu. Endpoint Gemini API bisa segera diaktifkan di backend!');
      }
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSend();
    });
  </script>
</body>
</html>
