<head>

</head>
<body>

<!-- TOP NAVBAR -->
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="/public/index.html" class="nav-logo" style="text-decoration:none">
      <div class="logo-badge"><img src="/src/assets/img/Logo.svg" alt="BAJA"></div>
      <div class="logo-text">BAJA</div>
    </a>
    <div class="nav-actions">
      <!-- navClock and navAuthSlot injected here -->
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="container" style="display:flex; align-items:center; gap:16px;">
    <div style="width:56px; height:56px; border-radius:50%; background:var(--accent-gradient, linear-gradient(135deg,#7c3aed,#06b6d4)); padding:2px; display:flex; align-items:center; justify-content:center; overflow:hidden;">
      <img src="/src/assets/img/bazz-mascot.svg" alt="Bazz Mascot" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">
    </div>
    <div>
      <div class="section-badge">🦏 <span data-en="AI Mascot Assistant" data-id="Asisten Maskot AI">AI Mascot Assistant</span></div>
      <h1 data-en="Bazz AI Chat" data-id="Chat Bazz AI">Bazz AI Chat</h1>
      <p data-en="Your smart companion for tools, crypto, and technical questions." data-id="Teman pintar untuk tools, crypto, dan pertanyaan teknis.">Your smart companion for tools, crypto, and technical questions.</p>
    </div>
  </div>
</div>

<section class="section" style="padding-top:20px; padding-bottom:60px;">
  <div class="container">
    <div style="max-width:850px; margin:0 auto; background:var(--card-bg, #1e293b); border:1px solid var(--border-color, #334155); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.3); overflow:hidden; display:flex; flex-direction:column; height:550px;">
      
      <!-- Chat Messages Area -->
      <div id="chatMessages" style="flex:1; padding:24px; overflow-y:auto; display:flex; flex-direction:column; gap:16px;">
        <div style="max-width:80%; padding:14px 18px; border-radius:12px; font-size:14.5px; line-height:1.5; background:var(--bg-color, #0f172a); border:1px solid var(--border-color, #334155); color:var(--text-color, #f8fafc); align-self:flex-start; border-bottom-left-radius:4px;">
          Halo Alfan! Aku <strong>Bazz</strong>, asisten badak resmi BAJA. Ada yang bisa kubantu seputar tools, keuangan, atau tutorial hari ini?
        </div>
      </div>

      <!-- Input Area -->
      <div style="padding:16px 20px; background:var(--nav-bg, #1e293b); border-top:1px solid var(--border-color, #334155); display:flex; gap:12px; align-items:center;">
        <input type="text" id="userInput" placeholder="Ketik pesan untuk Bazz..." autocomplete="off" style="flex:1; background:var(--bg-color, #0f172a); border:1px solid var(--border-color, #334155); color:var(--text-color, #f8fafc); padding:12px 16px; border-radius:10px; font-size:14px; outline:none;"/>
        <button id="sendBtn" class="btn btn-primary" style="padding:12px 24px; border-radius:10px; font-weight:600; cursor:pointer;">Kirim</button>
      </div>

    </div>
  </div>
</section>

<script src="/src/App.js"></script>
<script>
  const chatMessages = document.getElementById('chatMessages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  function appendMessage(sender, text) {
    const msg = document.createElement('div');
    msg.style.cssText = sender === 'user'
      ? 'max-width:80%; padding:14px 18px; border-radius:12px; font-size:14.5px; line-height:1.5; background:var(--accent-color,#0284c7); color:#fff; align-self:flex-end; border-bottom-right-radius:4px;'
      : 'max-width:80%; padding:14px 18px; border-radius:12px; font-size:14.5px; line-height:1.5; background:var(--bg-color,#0f172a); border:1px solid var(--border-color,#334155); color:var(--text-color,#f8fafc); align-self:flex-start; border-bottom-left-radius:4px;';
    msg.textContent = text;
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  async function handleSend() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage('user', text);
    userInput.value = '';

    const typing = document.createElement('div');
    typing.id = 'typingBubble';
    typing.style.cssText = 'max-width:80%; padding:14px 18px; border-radius:12px; font-size:14.5px; line-height:1.5; background:var(--bg-color,#0f172a); border:1px solid var(--border-color,#334155); color:#94a3b8; align-self:flex-start;';
    typing.textContent = 'Bazz sedang mengetik...';
    chatMessages.appendChild(typing);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    try {
      const res = await fetch('/api/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typing.remove();
      if (data && data.reply) {
        appendMessage('bot', data.reply);
      } else {
        appendMessage('bot', 'Halo Alfan! Pesanmu berhasil diterima. Siap dihubungkan ke Gemini API.');
      }
    } catch (err) {
      typing.remove();
      appendMessage('bot', 'Halo Alfan! Bazz siap membantu. Endpoint AI siap dihubungkan kapan saja.');
    }
  }

  sendBtn.addEventListener('click', handleSend);
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSend();
  });
</script>
</body>
</html>
