<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Bazz AI — Asisten Cerdas BAJA</title>
  <link rel="icon" href="/src/assets/img/bazz-mascot.svg"/>
  <link rel="stylesheet" href="/src/assets/css/style.css"/>
  <link rel="stylesheet" href="/src/assets/css/responsive.css"/>
  <style>
    body {
      background: var(--bg-color, #0f172a);
      color: var(--text-color, #f8fafc);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-container {
      max-width: 800px;
      margin: 90px auto 20px;
      width: 95%;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg, #1e293b);
      border: 1px solid var(--border-color, #334155);
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .chat-header {
      padding: 16px 20px;
      background: var(--nav-bg, #1e293b);
      border-bottom: 1px solid var(--border-color, #334155);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mascot-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .mascot-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mascot-info h2 {
      margin: 0;
      font-size: 18px;
      color: var(--text-color, #f8fafc);
      font-weight: 700;
    }
    .mascot-info p {
      margin: 2px 0 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .status-badge {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 5px;
    }
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 380px;
    }
    .msg {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg-bot {
      align-self: flex-start;
      background: #334155;
      color: #f1f5f9;
      border-bottom-left-radius: 4px;
    }
    .msg-user {
      align-self: flex-end;
      background: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .chat-input-area {
      padding: 14px 18px;
      background: var(--nav-bg, #1e293b);
      border-top: 1px solid var(--border-color, #334155);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      padding: 11px 14px;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
    }
    .chat-input:focus {
      border-color: #0284c7;
    }
    .send-btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .send-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/public/index.html" class="nav-logo" style="text-decoration:none">
        <div class="logo-badge"><img src="/src/assets/img/Logo.svg" alt="BAJA"></div>
        <div class="logo-text">BAJA</div>
      </a>
      <div class="nav-actions">
        <!-- navClock and navAuthSlot -->
      </div>
    </div>
  </nav>

  <!-- Chat Box Container -->
  <div class="chat-container">
    <div class="chat-header">
      <div class="mascot-avatar">
        <img src="/src/assets/img/bazz-mascot.svg" alt="Bazz Mascot">
      </div>
      <div class="mascot-info">
        <h2>Bazz AI</h2>
        <p><span class="status-badge"></span>Asisten Cerdas BAJA</p>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="msg msg-bot">
        Halo Alfan! Aku <strong>Bazz</strong>, asisten AI BAJA. Ada yang bisa kubantu seputar tools, keuangan, atau tutorial hari ini?
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="userInput" class="chat-input" placeholder="Ketik pesan untuk Bazz..." autocomplete="off"/>
      <button class="send-btn" id="sendBtn">Kirim</button>
    </div>
  </div>

  <script src="/src/App.js"></script>
  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(sender, text) {
      const msg = document.createElement('div');
      msg.className = 'msg ' + (sender === 'user' ? 'msg-user' : 'msg-bot');
      msg.textContent = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';

      const typing = document.createElement('div');
      typing.className = 'msg msg-bot';
      typing.id = 'typingBubble';
      typing.textContent = 'Bazz sedang mengetik...';
      chatMessages.appendChild(typing);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const res = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        typing.remove();
        if (data && data.reply) {
          appendMessage('bot', data.reply);
        } else {
          appendMessage('bot', 'Halo Alfan! Pesanmu berhasil diterima. Siap dihubungkan ke Gemini API.');
        }
      } catch (err) {
        typing.remove();
        appendMessage('bot', 'Halo Alfan! Bazz siap membantu. Endpoint AI siap dihubungkan kapan saja.');
      }
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSend();
    });
  </script>
</body>
</html>
