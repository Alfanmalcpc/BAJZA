<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    button {
      background: #f472b6;
      color: #fff;
      border: 2px solid #db2777;
      padding: 14px 20px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      height: 100%;
      font-size: 17px;
      box-shadow: 0 4px 10px rgba(244,114,182,0.5);
      letter-spacing: 0.5px;
      font-family: 'Space Grotesk', sans-serif;
      box-sizing: border-box;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:active {
      transform: scale(0.98);
      box-shadow: 0 2px 5px rgba(244,114,182,0.5);
    }
  </style>
  <script>
    // Script Monetag yang akan memicu iklan HANYA di dalam area ini
    (function(s){
      s.dataset.zone='11493758';
      s.src='https://al5sm.com/tag.min.js';
    })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));

    function handleClick() {
      // Kirim pesan ke parent window (Photobooth) bahwa tombol sudah diklik
      window.parent.postMessage('remove_watermark_clicked', '*');
    }
  </script>
<script src="https://5gvci.com/act/files/tag.min.js?z=11493748" data-cfasync="false" async data-sw="/sw.js"></script>
</head>
<body>
  <button onclick="handleClick()">🗑️ Hapus Watermark</button>
</body>
</html>
