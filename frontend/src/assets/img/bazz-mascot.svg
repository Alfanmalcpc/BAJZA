<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rhinoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="250" cy="250" r="210" fill="url(#cyberGlow)" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- Bazz Mascot Group -->
  <g transform="translate(0, 15)">
    <!-- Ears -->
    <path d="M 160 180 L 130 110 L 185 145 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 340 180 L 370 110 L 315 145 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    
    <path d="M 165 170 L 150 130 L 175 145 Z" fill="#38bdf8" opacity="0.6"/>
    <path d="M 335 170 L 350 130 L 325 145 Z" fill="#38bdf8" opacity="0.6"/>

    <!-- Head Base -->
    <path d="M 160 190 Q 250 150 340 190 Q 380 280 340 370 Q 250 410 160 370 Q 120 280 160 190 Z" fill="url(#rhinoBody)" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" filter="url(#neonGlow)"/>

    <!-- Armor plating accents -->
    <path d="M 170 210 Q 250 180 330 210 Q 320 310 330 350 Q 250 380 170 350 Q 180 310 170 210 Z" fill="#0f172a" opacity="0.25"/>

    <!-- Eyes (Cyber Glow) -->
    <g filter="url(#neonGlow)">
      <polygon points="185,230 220,225 210,250 180,245" fill="#fef08a" stroke="#fbbf24" stroke-width="3"/>
      <polygon points="315,230 280,225 290,250 320,245" fill="#fef08a" stroke="#fbbf24" stroke-width="3"/>
      <circle cx="202" cy="238" r="5" fill="#0284c7"/>
      <circle cx="298" cy="238" r="5" fill="#0284c7"/>
    </g>

    <!-- Snout & Nostrils -->
    <path d="M 200 290 Q 250 270 300 290 Q 320 350 300 370 Q 250 390 200 370 Q 180 350 200 290 Z" fill="#0f172a" opacity="0.18"/>
    <ellipse cx="230" cy="335" rx="10" ry="6" fill="#0369a1"/>
    <ellipse cx="270" cy="335" rx="10" ry="6" fill="#0369a1"/>

    <!-- Main Horn (Epic Golden Cyber Horn) -->
    <g filter="url(#neonGlow)">
      <path d="M 235 240 L 250 60 L 265 240 Z" fill="url(#hornGrad)" stroke="#fef08a" stroke-width="4" stroke-linejoin="round"/>
      <!-- Horn Tech Rings -->
      <line x1="240" y1="180" x2="260" y2="180" stroke="#b45309" stroke-width="4"/>
      <line x1="243" y1="130" x2="257" y2="130" stroke="#b45309" stroke-width="4"/>
      <line x1="246" y1="90" x2="254" y2="90" stroke="#b45309" stroke-width="4"/>
    </g>

    <!-- Small Second Horn -->
    <path d="M 220 200 L 228 140 L 240 195 Z" fill="url(#hornGrad)" stroke="#fef08a" stroke-width="3" stroke-linejoin="round"/>

    <!-- Friendly Cheerful Smile & Tech Visor detail -->
    <path d="M 220 360 Q 250 385 280 360" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Title Badge BAZZ -->
  <text x="250" y="455" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#f8fafc" text-anchor="middle" letter-spacing="3" filter="url(#neonGlow)">BAZZ THE RHINO</text>
</svg>
