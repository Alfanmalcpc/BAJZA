<style>
.calc-wrapper {
  max-width: 500px;
  margin: 0 auto;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
}

/* Display */
.calc-display {
  background: transparent;
  padding: 30px 24px 20px;
  text-align: right;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  position: relative;
}
.calc-history {
  font-size: 16px;
  color: var(--text-3);
  min-height: 24px;
  margin-bottom: 8px;
  word-wrap: break-word;
  font-family: monospace;
}
.calc-input {
  font-size: 44px;
  font-weight: 700;
  color: #fff;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
  font-family: monospace;
  letter-spacing: 2px;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
}
.calc-input::-webkit-scrollbar { display: none; }
.calc-indicators {
  position: absolute;
  top: 16px;
  left: 20px;
  display: flex;
  gap: 12px;
  font-size: 12px;
  font-weight: 800;
  color: var(--text-3);
  letter-spacing: 1px;
}
.ind-active { color: var(--blue-light); text-shadow: 0 0 10px rgba(96, 165, 250, 0.5); }

/* Unified Grid with Floating Buttons */
.calc-unified-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  padding: 24px;
  background: transparent;
}

.calc-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: var(--r-md);
  padding: 14px 4px;
  font-size: 16px;
  color: var(--text-1);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: inherit;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.calc-btn:hover { 
  background: rgba(255, 255, 255, 0.08); 
  border-color: rgba(255, 255, 255, 0.15);
  transform: translateY(-2px);
}
.calc-btn:active { 
  background: rgba(255, 255, 255, 0.12); 
  transform: translateY(1px); 
}

/* Specific Button Styles */
.btn-func { color: var(--blue-light); }
.btn-func:hover { box-shadow: 0 0 15px rgba(96, 165, 250, 0.15); }

.btn-num { font-size: 20px; background: rgba(255, 255, 255, 0.06); font-weight: 700; }
.btn-num:hover { background: rgba(255, 255, 255, 0.1); }

.btn-op { 
  color: #c4b5fd; 
  font-size: 22px; 
  background: rgba(139, 92, 246, 0.1); 
  border-color: rgba(139, 92, 246, 0.2); 
}
.btn-op:hover { background: rgba(139, 92, 246, 0.2); box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }

.btn-eq { 
  background: var(--grad-tools); 
  color: #fff; 
  font-size: 24px; 
  font-weight: 800; 
  border: none;
  box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
}
.btn-eq:hover { opacity: 0.9; box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6); }

.btn-clear { color: #f87171; font-weight: 800; font-size: 16px; background: rgba(248, 113, 113, 0.05); }
.btn-clear:hover { background: rgba(248, 113, 113, 0.1); box-shadow: 0 0 15px rgba(248, 113, 113, 0.2); }

.btn-toggle { color: #34d399; background: rgba(52, 211, 153, 0.05); }
.btn-toggle:hover { background: rgba(52, 211, 153, 0.1); box-shadow: 0 0 15px rgba(52, 211, 153, 0.2); }

.btn-mem { color: #fbbf24; font-size: 14px; background: rgba(251, 191, 36, 0.05); }
.btn-mem:hover { background: rgba(251, 191, 36, 0.1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); }
.mem-active { color: #fbbf24 !important; font-weight: 900; }

/* Inverse Toggle States */
.inv-view { display: none; }
.is-inv .norm-view { display: none; }
.is-inv .inv-view { display: inline; }
.is-inv .btn-inv { background: rgba(52, 211, 153, 0.2); color: #fff; box-shadow: 0 0 15px rgba(52, 211, 153, 0.4); }

@media(max-width: 500px) {
  .calc-unified-grid { padding: 16px; gap: 6px; }
  .calc-btn { padding: 12px 2px; font-size: 14px; }
  .btn-num { font-size: 18px; }
  .btn-op { font-size: 20px; }
  .calc-input { font-size: 36px; }
}

<script src="../app.js"></script>
<script>
  // -- Calculator Logic --
  const calcInput = document.getElementById('calcInput');
  const calcHistory = document.getElementById('calcHistory');
  const calcWrapper = document.getElementById('calcWrapper');
  const indDeg = document.getElementById('indDeg');
  const indRad = document.getElementById('indRad');
  const indMem = document.getElementById('indMem');
  
  let currentExpr = ''; // Visual representation
  let evaluated = false;
  let isInv = false;
  let isDeg = true;
  let memoryValue = 0;
  let ansValue = '';

  // math.js configuration for DEG/RAD
  const origSin = math.sin;
  const origCos = math.cos;
  const origTan = math.tan;
  const origAsin = math.asin;
  const origAcos = math.acos;
  const origAtan = math.atan;

  math.import({
    sin: function(x) { return isDeg ? origSin(math.unit(x, 'deg')) : origSin(x); },
    cos: function(x) { return isDeg ? origCos(math.unit(x, 'deg')) : origCos(x); },
    tan: function(x) { return isDeg ? origTan(math.unit(x, 'deg')) : origTan(x); },
    asin: function(x) { return isDeg ? origAsin(x) * 180 / math.pi : origAsin(x); },
    acos: function(x) { return isDeg ? origAcos(x) * 180 / math.pi : origAcos(x); },
    atan: function(x) { return isDeg ? origAtan(x) * 180 / math.pi : origAtan(x); }
  }, {override: true});

  function sanitizeForEval(expr) {
    let s = expr;
    s = s.replace(/×/g, '*');
    s = s.replace(/÷/g, '/');
    s = s.replace(/−/g, '-');
    s = s.replace(/π/g, 'pi');
    s = s.replace(/√\(/g, 'sqrt(');
    s = s.replace(/³√\(/g, 'cbrt(');
    s = s.replace(/²/g, '^2');
    s = s.replace(/³/g, '^3');
    s = s.replace(/%/g, '*0.01');
    s = s.replace(/Ans/g, `(${ansValue || 0})`);
    return s;
  }

  function updateDisplay(val) {
    if(!val) {
      calcInput.textContent = '0';
      return;
    }
    calcInput.textContent = val;
    calcInput.scrollLeft = calcInput.scrollWidth;
  }

  function updateMemoryInd() {
    indMem.textContent = memoryValue !== 0 ? 'M' : '';
    indMem.classList.toggle('mem-active', memoryValue !== 0);
  }

  // Handle Memory Buttons
  document.querySelectorAll('.btn-mem').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.getAttribute('data-mem');
      try {
        let currentVal = currentExpr ? math.evaluate(sanitizeForEval(currentExpr)) : 0;
        
        if (action === 'MC') {
          memoryValue = 0;
        } else if (action === 'MR') {
          if (evaluated) { currentExpr = ''; evaluated = false; }
          currentExpr += memoryValue;
          updateDisplay(currentExpr);
        } else if (action === 'M+') {
          memoryValue += currentVal;
          evaluated = true; 
        } else if (action === 'M-') {
          memoryValue -= currentVal;
          evaluated = true;
        } else if (action === 'MS') {
          memoryValue = currentVal;
          evaluated = true;
        }
        updateMemoryInd();
      } catch (e) {
        calcInput.textContent = 'Mem Error';
      }
    });
  });

  // Handle Toggles
  document.getElementById('btnInv').addEventListener('click', () => {
    isInv = !isInv;
    calcWrapper.classList.toggle('is-inv', isInv);
  });
  
  document.getElementById('btnDegRad').addEventListener('click', (e) => {
    isDeg = !isDeg;
    e.target.textContent = isDeg ? 'DEG' : 'RAD';
    indDeg.classList.toggle('ind-active', isDeg);
    indRad.classList.toggle('ind-active', !isDeg);
  });

  // Handle Input Buttons
  document.querySelectorAll('.calc-btn:not(.btn-toggle):not(.btn-mem)').forEach(btn => {
    btn.addEventListener('click', () => {
      let val = btn.getAttribute('data-val');
      
      if (isInv && btn.hasAttribute('data-inv')) {
        val = btn.getAttribute('data-inv');
      }
      
      if(val === 'AC') {
        currentExpr = '';
        calcHistory.textContent = '';
        evaluated = false;
        updateDisplay(currentExpr);
      }
      else if(val === 'DEL') {
        if(evaluated) {
          calcHistory.textContent = '';
          evaluated = false;
        }
        // Handle removing multi-char words visually
        if(currentExpr.endsWith('Ans')) currentExpr = currentExpr.slice(0, -3);
        else if(currentExpr.endsWith('sin(') || currentExpr.endsWith('cos(') || currentExpr.endsWith('tan(') || currentExpr.endsWith('log(')) currentExpr = currentExpr.slice(0, -4);
        else if(currentExpr.endsWith('sinh(') || currentExpr.endsWith('cosh(') || currentExpr.endsWith('tanh(') || currentExpr.endsWith('asin(') || currentExpr.endsWith('acos(') || currentExpr.endsWith('atan(') || currentExpr.endsWith('sqrt(') || currentExpr.endsWith('cbrt(')) currentExpr = currentExpr.slice(0, -5);
        else currentExpr = currentExpr.slice(0, -1);
        
        updateDisplay(currentExpr);
      }
      else if(val === 'sign') {
         if(currentExpr.startsWith('−')) {
           currentExpr = currentExpr.substring(1);
         } else if (currentExpr.startsWith('-')) {
           currentExpr = currentExpr.substring(1);
         } else {
           currentExpr = currentExpr === '' ? '−' : '−' + currentExpr;
         }
         updateDisplay(currentExpr);
      }
      else if(val === '=') {
        if(!currentExpr) return;
        try {
          const evalStr = sanitizeForEval(currentExpr);
          const result = math.evaluate(evalStr);
          calcHistory.textContent = calcInput.textContent + ' =';
          
          ansValue = result.toString();
          currentExpr = math.format(result, {precision: 14}).replace(/"/g, '');
          // ensure result minus uses hyphen-minus or unicode minus
          currentExpr = currentExpr.replace(/-/g, '−');
          updateDisplay(currentExpr);
          evaluated = true;
        } catch(e) {
          calcInput.textContent = 'Error';
          currentExpr = '';
        }
      }
      else {
        if(evaluated) {
          if(!['+', '−', '×', '÷', '^', '!', '²', '³', '%'].includes(val) && val !== 'E') {
             currentExpr = '';
          }
          calcHistory.textContent = '';
          evaluated = false;
        }
        currentExpr += val;
        updateDisplay(currentExpr);
      }
    });
  });
  
  // Keyboard support mapping physical keys to visual keys
  document.addEventListener('keydown', (e) => {
    let key = e.key;
    
    // Map standard keyboard to visual symbols
    if (key === '*') key = '×';
    if (key === '/') key = '÷';
    if (key === '-') key = '−';

    const validKeys = '0123456789+−×÷.^()%!eE';
    
    if(validKeys.includes(key)) {
      if(evaluated) {
        if(!['+', '−', '×', '÷', '^', '%', '!', 'e', 'E'].includes(key)) {
             currentExpr = '';
        }
        calcHistory.textContent = '';
        evaluated = false;
      }
      currentExpr += key;
      updateDisplay(currentExpr);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      document.querySelector('[data-val="="]').click();
    } else if (e.key === 'Backspace') {
      document.querySelector('[data-val="DEL"]').click();
    } else if (e.key === 'Escape') {
      document.querySelector('[data-val="AC"]').click();
    }
  });
</script>
