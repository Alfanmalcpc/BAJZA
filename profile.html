<style>
.profile-wrap { max-width: 520px; margin: 0 auto; padding: 100px 20px 60px; }
.profile-card {
  background: rgba(15,23,42,0.7); backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 24px;
  padding: 32px; box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  text-align: center;
}
.profile-avatar {
  width: 100px; height: 100px; border-radius: 50%;
  margin: 0 auto 20px; background: rgba(255,255,255,0.1);
  border: 3px solid var(--purple); object-fit: cover;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; color: #fff;
}
.profile-name { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--text-1); }
.profile-email { color: var(--text-2); font-size: 14px; margin-bottom: 32px; }
.profile-actions {
  display: flex; flex-direction: column; gap: 12px;
}
.btn-action {
  background: rgba(255,255,255,0.05); color: var(--text-1);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
  padding: 16px; font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  transition: all 0.2s; text-decoration: none;
}
.btn-action:hover {
  background: rgba(255,255,255,0.1); transform: translateY(-2px);
}
.btn-logout {
  background: rgba(239,68,68,0.1); color: #f87171; border-color: rgba(239,68,68,0.2);
}
.btn-logout:hover {
  background: rgba(239,68,68,0.2); color: #fca5a5;
}
.auth-prompt { display: none; padding: 40px 20px; text-align: center; }
.auth-prompt h2 { font-size: 22px; margin-bottom: 12px; }
.auth-prompt p { color: var(--text-2); margin-bottom: 24px; }
.btn-login {
  background: linear-gradient(135deg, #8B5CF6, #6D28D9); color: #fff;
  padding: 14px 32px; border-radius: var(--r-full); font-size: 15px; font-weight: 700;
  text-decoration: none; display: inline-block; transition: opacity 0.2s;
}
.btn-login:hover { opacity: 0.9; }

.info-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;
  background: rgba(0,0,0,0.2); padding: 16px; border-radius: 16px;
  text-align: left;
}
.info-item { display: flex; flex-direction: column; gap: 4px; }
.info-label { font-size: 11px; font-weight: 800; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; }
.info-val { font-size: 13px; color: var(--text-1); font-weight: 600; word-break: break-all; }

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; z-index: 9999;
}
.modal-content {
  background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
  padding: 24px; border-radius: 24px; width: 90%; max-width: 400px;
}
.modal-content h3 { margin-bottom: 20px; font-size: 20px; text-align: center; }
.form-group { margin-bottom: 16px; text-align: left; }
.form-group label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.input-text {
  width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.2); color: #fff; font-size: 14px; box-sizing: border-box;
}
.modal-actions { display: flex; gap: 12px; margin-top: 24px; }
.btn-save { flex: 1; padding: 12px; border-radius: 12px; background: linear-gradient(135deg, #8B5CF6, #6D28D9); color: #fff; font-weight: 700; border: none; cursor: pointer; }
.btn-cancel { flex: 1; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); color: #fff; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
</style>

<body>

<!-- TOP NAVBAR -->
<nav class="navbar" id="navbar">

    <a href="index.html" class="nav-logo" style="text-decoration:none">
      <div class="logo-badge">⚡</div>

<div class="profile-wrap">
  <!-- Content for logged in user -->
  <div class="profile-card" id="profileContent" style="display:none">
    <div class="profile-avatar" id="profAvatar">👤</div>
    <div class="profile-name" id="profName">Memuat...</div>
    <div class="profile-email" id="profEmail">Memuat...</div>

    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Penyedia Akun</span>
        <span class="info-val" id="profProvider">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Bergabung Sejak</span>
        <span class="info-val" id="profJoin">-</span>
      </div>
      <div class="info-item" style="grid-column: span 2;">
        <span class="info-label">Email Tertaut</span>
        <span class="info-val" id="profLinkedEmail">-</span>
      </div>
    </div>

    <div class="profile-actions">
      <button class="btn-action" id="btnEditProfile" data-en="✏️ Edit Profile" data-id="✏️ Ubah Profil">✏️ Ubah Profil</button>
      <a href="settings.html" class="btn-action" data-en="⚙️ Settings" data-id="⚙️ Pengaturan">⚙️ Pengaturan</a>
      <button class="btn-action btn-logout" id="btnLogout" data-en="🚪 Log Out" data-id="🚪 Keluar">🚪 Keluar</button>
    </div>
  </div>
  
  <!-- Content for logged out user -->
  <div class="profile-card auth-prompt" id="authPrompt">
    <div style="font-size:48px; margin-bottom:16px">🔒</div>
    <h2 data-en="Not Logged In" data-id="Belum Masuk">Belum Masuk</h2>
    <p data-en="Please log in to view your profile." data-id="Silakan masuk ke akun Anda untuk melihat profil.">Silakan masuk ke akun Anda untuk melihat profil.</p>
    <a href="auth.html" class="btn-login" data-en="Log In Now" data-id="Masuk Sekarang">Masuk Sekarang</a>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-content">
    <h3 data-en="Edit Profile" data-id="Ubah Profil">Ubah Profil</h3>
    <div class="form-group">
      <label data-en="Username" data-id="Nama Pengguna">Nama Pengguna</label>
      <input type="text" id="editName" class="input-text" />
    </div>
    <div class="form-group">
      <label data-en="Profile Photo URL (Optional)" data-id="URL Foto Profil (Opsional)">URL Foto Profil (Opsional)</label>
      <input type="text" id="editPhoto" class="input-text" placeholder="https://..." />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelEdit" data-en="Cancel" data-id="Batal">Batal</button>
      <button class="btn-save" id="btnSaveEdit" data-en="Save" data-id="Simpan">Simpan</button>
    </div>
  </div>
</div>

<button id="scrollTop">↑</button>

<script src="app.js"></script>
<script>
const profileContent = document.getElementById('profileContent');
const authPrompt = document.getElementById('authPrompt');
const profName = document.getElementById('profName');
const profEmail = document.getElementById('profEmail');
const profAvatar = document.getElementById('profAvatar');
const profProvider = document.getElementById('profProvider');
const profJoin = document.getElementById('profJoin');
const profLinkedEmail = document.getElementById('profLinkedEmail');

const btnLogout = document.getElementById('btnLogout');
const btnEditProfile = document.getElementById('btnEditProfile');
const editModal = document.getElementById('editModal');
const editName = document.getElementById('editName');
const editPhoto = document.getElementById('editPhoto');
const btnCancelEdit = document.getElementById('btnCancelEdit');
const btnSaveEdit = document.getElementById('btnSaveEdit');

auth.onAuthStateChanged(user => {
  if (user) {
    profileContent.style.display = 'block';
    authPrompt.style.display = 'none';
    
    profName.textContent = user.displayName || 'Pengguna BAJA';
    profEmail.textContent = user.email || '';
    
    if (user.photoURL) {
      profAvatar.innerHTML = `<img src="${user.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" alt="Profile" />`;
    } else {
      profAvatar.innerHTML = '👤';
    }

    profLinkedEmail.textContent = user.email || 'Tidak ada';
    profProvider.textContent = (user.providerData && user.providerData[0] && user.providerData[0].providerId) ? user.providerData[0].providerId : 'Email/Password';
    
    if (user.metadata && user.metadata.creationTime) {
       const d = new Date(user.metadata.creationTime);
       profJoin.textContent = d.toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'});
    } else {
       profJoin.textContent = '-';
    }
    
    editName.value = user.displayName || '';
    editPhoto.value = user.photoURL || '';

  } else {
    profileContent.style.display = 'none';
    authPrompt.style.display = 'block';
  }
});

btnEditProfile.addEventListener('click', () => { editModal.style.display = 'flex'; });
btnCancelEdit.addEventListener('click', () => { editModal.style.display = 'none'; });

btnSaveEdit.addEventListener('click', async () => {
    const newName = editName.value.trim();
    const newPhoto = editPhoto.value.trim();
    if (!newName) return alert('Nama tidak boleh kosong');
    
    const user = auth.currentUser;
    if (user) {
       btnSaveEdit.textContent = 'Menyimpan...';
       try {
           await user.updateProfile({ displayName: newName, photoURL: newPhoto });
           if (typeof updateDisplayName !== 'undefined') await updateDisplayName(user.uid, newName);
           if (typeof updatePhoto !== 'undefined' && newPhoto) await updatePhoto(user.uid, newPhoto);
           
           alert('Profil berhasil diperbarui!');
           location.reload();
       } catch (err) {
           console.error(err);
           alert('Gagal menyimpan profil.');
           btnSaveEdit.textContent = 'Simpan';
       }
    }
});

btnLogout.addEventListener('click', async () => {
  if(confirm('Apakah Anda yakin ingin keluar?')) {
    try {
      await auth.signOut();
      window.location.href = 'index.html';
    } catch(e) {
      console.error(e);
      alert('Gagal keluar.');
    }
  }
});
</script>
