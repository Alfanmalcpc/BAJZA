<link rel="stylesheet" href="responsive.css"/>

<body>

<!-- TOP NAVBAR -->
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo" style="text-decoration:none">
      <div class="logo-badge"><img src="Logo.svg" alt="BAJA"></div>
      <div class="logo-text">BAJA</div>
    </a>
    <div class="nav-actions"></div>
  </div>
</nav>

<!-- Hidden file input (opened from modal) -->
<input type="file" id="avatarFileInput" accept="image/*" style="display:none"/>

<div class="prof-wrap">

  <!-- Logged In -->
  <div id="profileContent" style="display:none">

    <!-- Avatar + Name Header -->
    <div class="prof-header-card">
      <div class="prof-avatar-box" id="profAvatar">👤</div>
      <div class="prof-header-info">
        <div class="prof-name" id="profName">Memuat...</div>
        <div class="prof-email" id="profEmail">Memuat...</div>
      </div>
    </div>

    <!-- Info Grid -->
    <div class="prof-section-label">👤 Informasi Akun</div>
    <div class="prof-info-grid">
      <div class="prof-info-item">
        <span class="prof-info-label">Penyedia Akun</span>
        <span class="prof-info-val" id="profProvider">-</span>
      </div>
      <div class="prof-info-item">
        <span class="prof-info-label">Bergabung Sejak</span>
        <span class="prof-info-val" id="profJoin">-</span>
      </div>
      <div class="prof-info-item prof-info-full">
        <span class="prof-info-label">Email Tertaut</span>
        <span class="prof-info-val" id="profLinkedEmail">-</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="prof-section-label">⚡ Menu</div>
    <div class="prof-actions">
      <button class="prof-action-btn prof-action-btn--edit" id="btnEditProfile">✏️ Ubah Profil &amp; Username</button>
      <a href="settings.html" class="prof-action-btn">⚙️ Pengaturan</a>
      <button class="prof-action-btn prof-action-btn--danger" id="btnLogout">🚪 Keluar</button>
    </div>

  </div>

  <!-- Logged Out -->
  <div class="prof-guest-card" id="authPrompt" style="display:none">
    <div style="font-size:52px;margin-bottom:16px">🔒</div>
    <h2 class="prof-guest-title">Belum Masuk</h2>
    <p class="prof-guest-desc">Silakan masuk ke akun BAJA Anda untuk melihat dan mengelola profil.</p>
    <a href="auth.html" class="btn-primary">🔑 Masuk Sekarang</a>
  </div>

</div>

<!-- Edit Modal -->
<div class="prof-modal-overlay" id="editModal">
  <div class="prof-modal-box">
    <h3 class="prof-modal-title">✏️ Ubah Profil</h3>

    <div class="prof-form-group">
      <label class="prof-form-label">Nama Pengguna / Username</label>
      <input type="text" id="editName" class="prof-input" placeholder="Masukkan nama Anda..."/>
    </div>

    <div class="prof-form-group">
      <label class="prof-form-label">Foto Profil (Opsional)</label>
      <button class="prof-file-btn" id="btnPickPhoto" type="button">📷 Pilih Foto dari Perangkat</button>
      <p id="photoFileName" class="prof-file-name">Belum ada foto dipilih</p>
    </div>

    <div class="prof-modal-actions">
      <button class="prof-modal-btn" id="btnCancelEdit">Batal</button>
      <button class="prof-modal-btn prof-modal-btn--save" id="btnSaveEdit">💾 Simpan</button>
    </div>
  </div>
</div>

<button id="scrollTop">↑</button>

<script src="app.js"></script>
<script>
const profileContent  = document.getElementById('profileContent');
const authPrompt      = document.getElementById('authPrompt');
const profAvatar      = document.getElementById('profAvatar');
const profName        = document.getElementById('profName');
const profEmail       = document.getElementById('profEmail');
const profProvider    = document.getElementById('profProvider');
const profJoin        = document.getElementById('profJoin');
const profLinkedEmail = document.getElementById('profLinkedEmail');
const btnEditProfile  = document.getElementById('btnEditProfile');
const editModal       = document.getElementById('editModal');
const editName        = document.getElementById('editName');
const btnCancelEdit   = document.getElementById('btnCancelEdit');
const btnSaveEdit     = document.getElementById('btnSaveEdit');
const btnPickPhoto    = document.getElementById('btnPickPhoto');
const photoFileName   = document.getElementById('photoFileName');
const avatarFileInput = document.getElementById('avatarFileInput');
const btnLogout       = document.getElementById('btnLogout');

let selectedPhotoDataUrl = null;
let currentPhotoInDB     = null; // track what's currently saved in DB

function setAvatar(photoURL) {
  if (photoURL) {
    profAvatar.innerHTML = `<img src="${photoURL}" alt="Foto Profil" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;"/>`;
  } else {
    profAvatar.innerHTML = '👤';
  }
}

auth.onAuthStateChanged(async user => {
  if (user) {
    profileContent.style.display = 'block';
    authPrompt.style.display     = 'none';

    // Set basic info from Auth first (fast)
    profName.textContent  = user.displayName || 'Pengguna BAJA';
    profEmail.textContent = user.email || '';
    profLinkedEmail.textContent = user.email || 'Tidak ada';
    const pid = user.providerData?.[0]?.providerId || 'password';
    profProvider.textContent = pid === 'google.com' ? '🔵 Google' : '📧 Email & Password';
    if (user.metadata?.creationTime) {
      const d = new Date(user.metadata.creationTime);
      profJoin.textContent = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    editName.value = user.displayName || '';

    // Load photo + name from Realtime DB (most up-to-date source)
    try {
      const snap = await db.ref(`users/${user.uid}`).once('value');
      const profile = snap.val() || {};

      // DB photoURL takes priority over Auth photoURL
      currentPhotoInDB = profile.photoURL || user.photoURL || null;
      setAvatar(currentPhotoInDB);

      // If DB has a newer display name, use it
      if (profile.displayName) {
        profName.textContent = profile.displayName;
        editName.value = profile.displayName;
      }
    } catch(e) {
      // Fallback to Auth data
      setAvatar(user.photoURL);
      currentPhotoInDB = user.photoURL || null;
    }

  } else {
    profileContent.style.display = 'none';
    authPrompt.style.display     = 'block';
  }
});

btnEditProfile.addEventListener('click', () => { editModal.style.display = 'flex'; });
btnPickPhoto.addEventListener('click', () => avatarFileInput.click());

avatarFileInput.addEventListener('change', async () => {
  const file = avatarFileInput.files?.[0];
  if (!file) return;
  photoFileName.textContent = `📎 ${file.name}`;
  try {
    selectedPhotoDataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 300;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else       { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  } catch(err) { alert('Gagal memproses gambar.'); }
});

btnCancelEdit.addEventListener('click', () => {
  editModal.style.display = 'none';
  selectedPhotoDataUrl = null;
  photoFileName.textContent = 'Belum ada foto dipilih';
  avatarFileInput.value = '';
});

btnSaveEdit.addEventListener('click', async () => {
  const newName = editName.value.trim();
  if (!newName) { alert('Nama tidak boleh kosong.'); return; }
  const user = auth.currentUser;
  if (!user) return;

  btnSaveEdit.textContent = 'Menyimpan...';
  btnSaveEdit.disabled = true;

  try {
    // 1. Update nama di Auth + DB menggunakan helper firebase.js
    await updateDisplayName(user.uid, newName);

    // 2. Jika ada foto baru, simpan ke DB
    if (selectedPhotoDataUrl) {
      await updatePhoto(user.uid, selectedPhotoDataUrl);
      currentPhotoInDB = selectedPhotoDataUrl;
    }

    // 3. Update UI
    profName.textContent = newName;
    editName.value       = newName;
    setAvatar(currentPhotoInDB);

    // 4. Reset modal
    editModal.style.display  = 'none';
    selectedPhotoDataUrl      = null;
    photoFileName.textContent = 'Belum ada foto dipilih';
    avatarFileInput.value     = '';

    alert('✅ Profil berhasil diperbarui!');
  } catch(err) {
    console.error('Save error:', err);
    alert('Gagal menyimpan:\n' + (err.message || err));
  } finally {
    btnSaveEdit.textContent = '💾 Simpan';
    btnSaveEdit.disabled    = false;
  }
});

btnLogout.addEventListener('click', async () => {
  if (confirm('Apakah Anda yakin ingin keluar?')) {
    try { await auth.signOut(); window.location.href = 'index.html'; }
    catch(e) { alert('Gagal keluar.'); }
  }
});
</script>
